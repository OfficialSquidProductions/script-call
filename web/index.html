<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Script Call</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="#" aria-label="Script Call home"><img src="assets/SP_PURPLE.png" alt="SP" class="brand-logo"><span>Script Call</span></a><p class="credit">A Squid Productions Software</p><p class="local-label" id="app-version">Opening Script Call…</p><div class="side-caption"><label for="production">PRODUCTIONS</label><button id="new-production" title="New production" aria-label="New production">+</button></div><select id="production" aria-label="Select production"></select><div class="side-caption days-caption"><span>SHOOTING DAYS</span><button id="days-overview" title="All shooting days by week" aria-label="All shooting days by week"><span class="four-panes" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button><button id="add-day" title="Add day" aria-label="Add shooting day">+</button></div><div id="week-navigation"></div><div id="days" class="days"></div><div class="day-history"><button id="undo-day" disabled>Undo day change</button><button id="redo-day" disabled>Redo</button><button id="deleted-days">Deleted days</button></div><nav id="workspace-nav"><button data-view="daily" class="active">Daily sheet</button><button data-view="production">Production data</button><button data-view="layout">Templates & layout</button><button data-view="revisions">Issued revisions</button></nav><div class="sidebar-bottom"><p><i></i> Saved on your computer</p><button id="backup">Create local backup</button><button id="updates">Check for updates</button><button id="report-bug">Report a Bug</button><button id="settings">Settings & help</button></div></aside>
<main><header class="topbar"><div id="breadcrumb">Workspace / Opening production</div><div class="topbar-right"><span id="save-state" role="status">Opening local files…</span><button id="save" title="Save now">Save</button><button id="export-project">Export project</button><button id="import-project">Open project</button><button id="import-productiondesk">Import Production Desk</button></div></header><section class="page-heading"><div><p class="eyebrow" id="eyebrow">DAILY CALL SHEET</p><h1 id="heading">Your production, day by day.</h1><p id="subtitle"></p></div><div class="heading-actions"><button id="previous" aria-label="Previous day">← Previous</button><button id="next" aria-label="Next day">Next →</button><button id="duplicate-day">Duplicate day</button><button id="export-pdf">Export PDF</button><button id="issue" class="primary">Review & issue</button></div></section><div id="summary" class="summary-bar"></div><div id="project-notice" class="notice" hidden></div><section id="diagnostic-notice" class="notice" aria-label="Local failure report" hidden><p id="diagnostic-summary" role="status"></p><button id="review-diagnostics">Review report</button> <button id="dismiss-diagnostics">Dismiss local alerts</button></section><section id="content"></section></main>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">×</button></div><div id="modal-body" class="modal-body"></div><p id="modal-error" class="modal-error" role="alert"></p><div id="modal-actions" class="modal-actions"></div></dialog><div id="toast" role="status"></div><script src="day-management.js"></script><script src="availability.js"></script><script src="availability-ui.js"></script><script src="crew-departments.js"></script><script src="location-maps.js"></script><script src="app.js"></script>
</body></html>
